# -----------------------------------------------------------------------------
# Solarized Light Status
# -----------------------------------------------------------------------------

set -g status-style "bg=#eee8d5,fg=#657b83"
set -g status-left-length "100"
set -g status-right-length "100"

# LEFT: Session Block
set -g status-left "#[fg=#fdf6e3,bg=#268bd2,bold] #S #[default] "

# WINDOWS
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#657b83,bg=#eee8d5] #I | #W "
setw -g window-status-current-format "#[fg=#fdf6e3,bg=#93a1a1,bold] #I | #W "

# RIGHT
set -g status-right "#[fg=#fdf6e3,bg=#93a1a1] %H:%M #[fg=#fdf6e3,bg=#268bd2] #h "
