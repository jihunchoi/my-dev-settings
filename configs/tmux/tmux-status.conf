# -----------------------------------------------------------------------------
# Terminal-native Status (default colors, with reverse video for emphasis)
# -----------------------------------------------------------------------------

set -g status-style "bg=default,fg=default"
set -g status-left-length "100"
set -g status-right-length "100"

# LEFT: Session Block
set -g status-left "#[reverse,bold] #S #[default] "

# WINDOWS
setw -g window-status-separator ""
setw -g window-status-format "#[default] #I | #W "
setw -g window-status-current-format "#[reverse,bold] #I | #W #[default]"

# RIGHT
set -g status-right "#[default] %H:%M #[reverse,bold] #h #[default]"
